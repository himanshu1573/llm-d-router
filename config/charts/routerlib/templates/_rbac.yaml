{{- define "llm-d-router.rbac" -}}
{{/* The EPP serves /metrics behind controller-runtime's delegating authenticator unless
     --metrics-endpoint-auth=false is passed, which the deployment does only when
     monitoring.prometheus.auth.enabled is false. Gate the TokenReview and
     SubjectAccessReview permissions that authenticator needs on the same value, so a
     release that authenticates its metrics endpoint always has the RBAC to do it. */}}
{{- if .Values.router.monitoring.prometheus.auth.enabled }}
---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ include "llm-d-router.cluster-rbac-name" . }}
  labels:
    {{- include "llm-d-router.labels" . | nindent 4 }}
rules:
- apiGroups:
    - authentication.k8s.io
  resources:
    - tokenreviews
  verbs:
    - create
- apiGroups:
    - authorization.k8s.io
  resources:
    - subjectaccessreviews
  verbs:
    - create
- nonResourceURLs:
    - "/metrics"
  verbs:
    - get
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ include "llm-d-router.cluster-rbac-name" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "llm-d-router.name" . }}
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "llm-d-router.cluster-rbac-name" . }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ printf "%s-sa" (include "llm-d-router.name" .) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "llm-d-router.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ printf "%s-sa" (include "llm-d-router.name" .) }}
  namespace: {{ .Release.Namespace }}
subjects:
- kind: ServiceAccount
  name: {{ include "llm-d-router.name" . }}
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ printf "%s-sa" (include "llm-d-router.name" .) }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "llm-d-router.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "llm-d-router.labels" . | nindent 4 }}
---
{{- end }}
